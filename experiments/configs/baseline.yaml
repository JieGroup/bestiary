# Upstream default — playground/open_duck_mini_v2/joystick.py:default_config()
# Copied verbatim as of upstream commit b9be205. Baseline for every diff.
name: baseline
env: joystick
task: flat_terrain_backlash
num_timesteps: 150000000

use_imitation_reward: true   # module-level flag in joystick.py
use_motor_speed_limits: true

ctrl_dt: 0.02
sim_dt: 0.002
episode_length: 1000
action_repeat: 1
action_scale: 0.25
dof_vel_scale: 0.05
history_len: 0
soft_joint_pos_limit_factor: 0.95
max_motor_velocity: 5.24   # rad/s

noise_config:
  level: 1.0
  action_min_delay: 0
  action_max_delay: 3
  imu_min_delay: 0
  imu_max_delay: 3
  scales:
    hip_pos: 0.03
    knee_pos: 0.05
    ankle_pos: 0.08
    joint_vel: 2.5
    gravity: 0.1
    linvel: 0.1
    gyro: 0.1
    accelerometer: 0.05

reward_config:
  scales:
    tracking_lin_vel: 2.5
    tracking_ang_vel: 6.0
    torques: -0.001
    action_rate: -0.5
    stand_still: -0.2
    alive: 20.0
    imitation: 1.0
  tracking_sigma: 0.01

push_config:
  enable: true
  interval_range: [5.0, 10.0]
  magnitude_range: [0.1, 1.0]

lin_vel_x: [-0.15, 0.15]
lin_vel_y: [-0.2, 0.2]
ang_vel_yaw: [-1.0, 1.0]
neck_pitch_range: [-0.34, 1.1]
head_pitch_range: [-0.78, 0.78]
head_yaw_range: [-1.5, 1.5]
head_roll_range: [-0.5, 0.5]
head_range_factor: 1.0
